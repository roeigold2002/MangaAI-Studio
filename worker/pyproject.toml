[project]
name = "mangaai-worker"
version = "0.1.0"
description = "Vision worker for MangaAI Studio: detection, OCR, inpainting, Hebrew typesetting"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "torch==2.14.1",
    "transformers==5.19.0",
    "manga-ocr==0.1.16",
    "pillow==12.3.0",
    "numpy==2.5.4",
    "opencv-python-headless>=4.10",
    "huggingface-hub==2.2.0",
    "safetensors==0.8.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
